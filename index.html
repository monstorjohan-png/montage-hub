<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montage Hub — دليل مواقع المونتاج</title>
  <meta name="description" content="دليل شامل لجميع مواقع المونتاج: مؤثرات، ساوند افكت، صور، فيديوهات، موشن جرافيك، أيقونات متحركة، أشكال 2D/3D — مجاني ومدفوع." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Naskh Arabic', 'system-ui', 'sans-serif'],
          },
          colors: {
            accent: '#6366f1',
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 transition-colors duration-300">
  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-neutral-950/70 border-b border-neutral-200/60 dark:border-neutral-800/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-2 font-bold text-lg">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-accent text-white">M</span>
        <span data-i18n="brand">Montage Hub</span>
      </a>
      <div class="flex items-center gap-2">
        <button id="langToggle" class="px-3 py-1.5 rounded-lg border border-neutral-300 dark:border-neutral-700 text-sm font-medium hover:bg-neutral-100 dark:hover:bg-neutral-800 transition" aria-label="Toggle language">EN</button>
        <button id="themeToggle" class="p-2 rounded-lg border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition" aria-label="Toggle theme">
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-8 text-center">
      <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight" data-i18n="heroTitle">دليل مواقع المونتاج</h1>
      <p class="mt-4 text-lg text-neutral-600 dark:text-neutral-400 max-w-2xl mx-auto" data-i18n="heroSub">جميع مواقع المؤثرات، ساوند افكت، الصور، الفيديوهات، الموشن جرافيك، الأيقونات المتحركة، والأشكال 2D/3D — مجاني ومدفوع — في مكان واحد.</p>
    </div>
  </section>

  <!-- Search & Filters -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-6">
    <div class="flex flex-col gap-4">
      <div class="relative">
        <input id="searchInput" type="search" placeholder="" data-i18n-placeholder="searchPlaceholder" class="w-full px-5 py-3.5 rounded-2xl border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent transition text-base" />
        <svg class="absolute top-1/2 -translate-y-1/2 end-4 w-5 h-5 text-neutral-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <div class="flex flex-wrap gap-2 justify-center" id="categoryFilters"></div>
      <div class="flex flex-wrap gap-2 justify-center" id="priceFilters"></div>
    </div>
    <div class="mt-4 text-center text-sm text-neutral-500 dark:text-neutral-400">
      <span id="resultCount">0</span> <span data-i18n="resultsLabel">نتيجة</span>
    </div>
  </section>

  <!-- Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    <div id="emptyState" class="hidden text-center py-20 text-neutral-500 dark:text-neutral-400">
      <p data-i18n="noResults">لا توجد نتائج. جرب بحثاً آخر.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-200 dark:border-neutral-800 py-8 text-center text-sm text-neutral-500 dark:text-neutral-400">
    <p data-i18n="footer">Montage Hub — دليل مواقع المونتاج. جميع الروابط تؤدي إلى مواقع خارجية.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
